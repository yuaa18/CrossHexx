name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # レガシーな VB2012 / .NET Framework 4.x 向けに windows-2022 に固定
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild CrossHexx.sln /p:Configuration=Release /v:minimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossHexx-Release
          path: CrossHexx/bin/Release/

      - name: Zip release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path CrossHexx/bin/Release/* -DestinationPath CrossHexx-${{ github.ref_name }}.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CrossHexx-${{ github.ref_name }}.zip
          generate_release_notes: true
